services:

  db:
    image: postgres:16-alpine
    container_name: defmobile_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-defmobile}
      POSTGRES_USER:     ${POSTGRES_USER:-defuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defpassword123}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defuser} -d ${POSTGRES_DB:-defmobile}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: defmobile_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
