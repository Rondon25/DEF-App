services:

  db:
    image: postgres:16-alpine
    container_name: defmobile_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-defmobile}
      POSTGRES_USER:     ${POSTGRES_USER:-defuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defpassword123}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defuser} -d ${POSTGRES_DB:-defmobile}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: defmobile_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  metabase:
    image: metabase/metabase:latest
    container_name: defmobile_metabase
    restart: unless-stopped
    ports:
      - "8085:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB:-defmobile}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-defuser}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-defpassword123}
      MB_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
